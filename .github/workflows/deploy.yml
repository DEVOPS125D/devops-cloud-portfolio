name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:latest

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-frontend:latest

  deploy-validation:
    name: Validate Kubernetes Deployments
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Kubectl CLI
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.30.0'

      - name: Validate All Kubernetes Manifests (Dry-Run & Linting)
        run: |
          echo "Validating Kubernetes manifests..."
          kubectl apply -f k8s/00-namespace.yaml --dry-run=client
          kubectl apply -f k8s/01-postgres.yaml --dry-run=client
          kubectl apply -f k8s/02-backend.yaml --dry-run=client
          kubectl apply -f k8s/03-frontend.yaml --dry-run=client
          kubectl apply -f k8s/04-prometheus.yaml --dry-run=client
          kubectl apply -f k8s/05-grafana.yaml --dry-run=client
          echo "All Kubernetes production manifests passed validation."
